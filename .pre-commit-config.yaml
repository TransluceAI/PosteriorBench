repos:
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
  - repo: https://github.com/pycqa/isort
    rev: 5.12.0
    hooks:
      - id: isort
        exclude: ^methods/
      # methods/ is a project of its own, with its own isort settings.
      - id: isort
        name: isort (methods)
        files: ^methods/
        args: ["--settings-path", "methods", "--filter-files"]
